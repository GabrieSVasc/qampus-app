<header class="header">

    <h1
        class="logo"
        (click)="goTo('home')">
        Qampus
    </h1>

    <div class="nav-actions">

        <button
            class="nav-button"
            (click)="goTo('anuncios')">
            Anúncios
        </button>

        @if (isProfessor()) {
            <button
                class="nav-button"
                (click)="goTo('anuncios/criar')">
                Publicar anúncio
            </button>
        }

    </div>

    <div class="user-menu">
        <img
            src="/user-logo.png"
            style="cursor: pointer;"
            width="40"
            height="40"
            (click)="toggleMenu()">

        @if (menuAberto) {
            <div class="dropdown">

                <button
                    (click)="goTo('perfil')"
                    class="dropdown-perfil dropdown-button">
                    Meu Perfil
                </button>

                <button
                    (click)="logout()"
                    class="dropdown-deslogar">
                    Deslogar
                </button>

            </div>
        }
    </div>

</header>
