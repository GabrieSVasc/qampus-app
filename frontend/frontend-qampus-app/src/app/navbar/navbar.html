<header class="header">
    <h1 style="padding-left: 50px; cursor: pointer;" (click)="goTo('home')">Qampus</h1>
    <div class="user-menu">
        <img src="/user-logo.png" style="cursor: pointer;" width="40" height="40" (click)="toggleMenu()">
        @if (menuAberto) {
            <div class="dropdown">
                <button (click)="goTo('perfil')" class="dropdown-perfil dropdown-button">Meu Perfil</button>
                <button (click)="logout()" class="dropdown-deslogar">Deslogar</button>
            </div>
        }
    </div>
</header>
