<app-navbar></app-navbar>

<div class="container">
    <section class="title-button">
        <p>Cursos Cadastrados</p>
        @if(canCreate){
            <button (click)="criarCurso()" class="create-button">Novo Curso</button>
        }
    </section>
    @for (curso of cursos; track curso.id) {
        <article class="card">
    <div class="content">
        <div>
            <h2 style="margin-bottom: 0;">{{curso.nome}}</h2>
            <p style="margin-top: 0;">Email do coordenador: {{curso.email}}</p>
        </div>

        <div style="position: absolute; top: 0; right: 0; margin-top: 10px; margin-right: 10px;">
            <img src="/remove.png" width="20px" height="20px" (click)="remove(curso.id)">
            <img src="/edit.png" width="20px" height="20px" (click)="edit(curso.id)">
        </div>
        <p style="position: absolute; bottom: 0; right: 0; margin-bottom: 10px; margin-right: 10px;">{{curso.bloco}}</p>
    </div>
</article>
    }
</div>
